[project]
name = "bandwidth"
version = "0.1.0"
description = "A text-based, bandwidth-friendly news aggregator"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
bandwidth = "src.aggregator:main"
