# bandwidth news sources
# Open source and non-profit news organizations only

sources:
  # Non-profit / Public Media
  - name: NPR News
    url: https://feeds.npr.org/1001/rss.xml
    homepage: https://www.npr.org
    type: rss

  - name: PBS NewsHour
    url: https://www.pbs.org/newshour/feeds/rss/headlines
    homepage: https://www.pbs.org/newshour
    type: rss
    extraction_mode: recall
    content_end_pattern: "Support trusted journalism and civil dialogue."

  - name: Democracy Now
    url: https://www.democracynow.org/democracynow.rss
    homepage: https://www.democracynow.org
    type: rss

  - name: Texas Tribune
    url: https://feeds.texastribune.org/feeds/main
    homepage: https://www.texastribune.org
    type: rss

  # Non-profit Investigative Journalism
  - name: ProPublica
    url: https://www.propublica.org/feeds/propublica/main
    homepage: https://www.propublica.org
    type: rss

  - name: The Markup
    url: https://themarkup.org/feeds/rss.xml
    homepage: https://themarkup.org
    type: rss

  - name: The Intercept
    url: https://theintercept.com/feed/?rss
    homepage: https://theintercept.com
    type: rss
    content_end_pattern: "IT['\u2018\u2019]S EVEN WORSE THAN WE THOUGHT"

  - name: Center for Public Integrity
    url: https://publicintegrity.org/feed/
    homepage: https://publicintegrity.org
    type: rss

  # Community / International Non-profit
  - name: Global Voices
    url: https://globalvoices.org/feed/
    homepage: https://globalvoices.org
    type: rss

  - name: Common Dreams
    url: https://www.commondreams.org/feeds/news.rss
    homepage: https://www.commondreams.org
    type: rss

  - name: Truthout
    url: https://truthout.org/feed/
    homepage: https://truthout.org
    type: rss
    content_end_patterns:
      - "Truthout has launched a fundraiser"
      - "We appeal for your support"

  # Additional Non-profit Investigative
  - name: Reveal
    url: https://revealnews.org/feed/
    homepage: https://revealnews.org
    type: rss

  - name: Grist
    url: https://grist.org/feed/
    homepage: https://grist.org
    type: rss

  - name: Inside Climate News
    url: https://insideclimatenews.org/feed/
    homepage: https://insideclimatenews.org
    type: rss
    content_end_pattern: "About This Story"

  # Open Source / Citizen Journalism
  - name: Bellingcat
    url: https://www.bellingcat.com/feed/
    homepage: https://www.bellingcat.com
    type: rss
    content_end_pattern: "Bellingcat is a non-profit"

  - name: Nonprofit Quarterly
    url: https://nonprofitquarterly.org/feed/
    homepage: https://nonprofitquarterly.org
    type: rss
    content_end_pattern: "For More on This Topic:"

  # New sources
  - name: Colorlines
    url: https://feeds2.feedburner.com/racewireblog
    homepage: https://colorlines.com/
    type: rss

  - name: ZNetwork
    url: https://znetwork.org/feed/?post_type=znetarticle
    homepage: https://znetwork.org
    type: rss

  - name: The 19th
    url: https://19thnews.org/feed/
    homepage: https://19thnews.org/
    type: rss

  - name: Jacobin
    url: https://jacobin.com/feed/
    homepage: https://jacobin.com/
    type: rss

  - name: CounterPunch
    url: https://www.counterpunch.org/feed/
    homepage: https://www.counterpunch.org/
    type: rss
  
  - name: The Marshall Project
    url: https://www.themarshallproject.org/rss/recent.rss
    homepage: https://www.themarshallproject.org
    type: rss