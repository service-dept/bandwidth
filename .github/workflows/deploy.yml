name: Deploy to Cloudflare Pages

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore stats cache
        uses: actions/cache/restore@v4
        with:
          path: stats.json
          key: stats-
          restore-keys: |
            stats-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install feedparser httpx pyyaml jinja2 trafilatura lxml_html_clean

      - name: Run aggregator
        run: python -m src.aggregator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Save stats cache
        uses: actions/cache/save@v4
        with:
          path: stats.json
          key: stats-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy output --project-name=bandwidth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
